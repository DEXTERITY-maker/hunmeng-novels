name: Anons Studio isolated preview
on:
  push:
    branches:
      - feat/anons-studio-mvp-20261103
      - fix/anons-v06-audit-20261103
      - feat/anons-template-catalog-20261104
      - feat/anons-quick-start-20261104
      - feat/anons-personal-styles-20261104
      - feat/anons-cloud-styles-20261104
      - feat/anons-brand-kit-20261104
      - feat/anons-manual-orders-20261104
      - feat/anons-business-templates-flexible-orders-20261104
      - feat/anons-pro-series-templates-20261104
      - feat/anons-studio-workspace-20261105
      - feat/anons-pricing-current-plan-20261105
      - feat/anons-agency-ultimate-tiers-20261105
    paths:
      - 'anons-studio/**'
      - '.github/workflows/anons-studio-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anons-studio-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci
      - name: Build isolated studio with bundled Supabase Auth client
        run: node anons-studio/build.mjs
      - name: Check self-contained frontend
        run: |
          node --check anons-studio/app.js
          node --check anons-studio/export-profiles.js
          node --check anons-studio/personal-styles.js
          node --check anons-studio/brand-kit.js
          node --check anons-studio/manual-orders-entry.js
          node --check anons-studio/studio-workspace-entry.js
          node --check anons-studio/pricing-status.js
          test -s anons-studio/dist/pricing-status.js
          test -s anons-studio/index.html
          test -s anons-studio/styles.css
          test -s anons-studio/dist/auth.bundle.js
          test -s anons-studio/dist/index.html
          test -s anons-studio/dist/editor.html
          test -s anons-studio/dist/export-profiles.js
          test -s anons-studio/dist/templates.html
          test -s anons-studio/dist/features.html
          test -s anons-studio/dist/pricing.html
          grep -q 'id="poster"' anons-studio/editor.html
          grep -q 'id="export"' anons-studio/editor.html
          grep -q 'data-template="aurora"' anons-studio/templates.html
          grep -q 'id="billing-availability"' anons-studio/pricing.html
          grep -q 'toBlob' anons-studio/app.js
          grep -q 'localStorage' anons-studio/app.js
      - name: Test payment and export authorization boundaries
        run: node --test anons-studio/security.test.mjs anons-studio/sandbox-webhook.test.mjs anons-studio/billing-ux.test.mjs anons-studio/renderer-contract.test.mjs anons-studio/auth-session.test.mjs
      - name: Test gallery, personal styles and brand kit libraries
        run: node --test anons-studio/templates-catalog.test.mjs anons-studio/templates-assistant.test.mjs anons-studio/personal-styles.test.mjs anons-studio/cloud-styles.test.mjs anons-studio/brand-kit.test.mjs anons-studio/manual-orders.test.mjs anons-studio/manual-orders-security.test.mjs anons-studio/business-templates-and-plans.test.mjs anons-studio/pro-features.test.mjs anons-studio/studio-workspace.test.mjs anons-studio/pricing-status.test.mjs anons-studio/agency-ultimate.test.mjs
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test actual editor, responsive layout and PNG export
        run: node anons-studio/smoke.mjs
      - name: Upload synthetic mobile and desktop editor previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anons-editor-previews-${{ github.run_id }}
          path: |
            anons-studio/test-artifacts/preview-*.png
            anons-studio/test-artifacts/editor-settings-*.png
            anons-studio/test-artifacts/direct-canvas-*.png
            anons-studio/test-artifacts/home-*.png
            anons-studio/test-artifacts/editor-overview-*.png
            anons-studio/test-artifacts/library-overview-*.png
            anons-studio/test-artifacts/account-overview-*.png
            anons-studio/test-artifacts/stage4-poster-*.png
            anons-studio/test-artifacts/stage4-typography-*.png
            anons-studio/test-artifacts/stage5-photo-tools-*.png
            anons-studio/test-artifacts/stage5-photo-poster-*.png
            anons-studio/test-artifacts/stage6-direct-controls-*.png
            anons-studio/test-artifacts/stage6-composition-*.png
            anons-studio/test-artifacts/stage7-multiselect-*.png
            anons-studio/test-artifacts/stage7-composition-*.png
            anons-studio/test-artifacts/stage8-safe-panel-*.png
            anons-studio/test-artifacts/stage8-safe-overlay-*.png
            anons-studio/test-artifacts/stage9-export-kit-*.png
            anons-studio/test-artifacts/stage10-export-profiles-*.png
            anons-studio/test-artifacts/stage11-series-planner-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish standalone preview (never existing production)
        if: github.ref == 'refs/heads/feat/anons-studio-mvp-20261103' || github.ref == 'refs/heads/feat/anons-template-catalog-20261104' || github.ref == 'refs/heads/feat/anons-quick-start-20261104' || github.ref == 'refs/heads/feat/anons-personal-styles-20261104' || github.ref == 'refs/heads/feat/anons-cloud-styles-20261104' || github.ref == 'refs/heads/feat/anons-brand-kit-20261104' || github.ref == 'refs/heads/feat/anons-manual-orders-20261104' || github.ref == 'refs/heads/feat/anons-business-templates-flexible-orders-20261104' || github.ref == 'refs/heads/feat/anons-pro-series-templates-20261104' || github.ref == 'refs/heads/feat/anons-studio-workspace-20261105' || github.ref == 'refs/heads/feat/anons-pricing-current-plan-20261105' || github.ref == 'refs/heads/feat/anons-agency-ultimate-tiers-20261105'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy anons-studio/dist --project-name=anons-studio-preview --branch=preview
