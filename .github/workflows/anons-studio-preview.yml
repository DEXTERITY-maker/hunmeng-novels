name: Anons Studio isolated preview
on:
  push:
    branches:
      - feat/anons-studio-mvp-20261103
      - feat/anons-studio-editor-v07-20261103
      - feat/anons-studio-editor-v08-20261103
      - feat/anons-studio-editor-v09-20261103
      - feat/anons-studio-v10-rc-20261103
      - feat/anons-studio-v10-launch-qa-20261103
      - feat/anons-studio-multidevice-qa-20261103
      - feat/anons-studio-png-parity-20261103
      - fix/anons-v06-audit-20261103
      - fix/anons-refund-v10-20261104
    paths:
      - 'anons-studio/**'
      - '.github/workflows/anons-studio-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anons-studio-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci
      - name: Build isolated studio with bundled Supabase Auth client
        run: node anons-studio/build.mjs
      - name: Check self-contained frontend
        run: |
          node --check anons-studio/app.js
          test -s anons-studio/index.html
          test -s anons-studio/styles.css
          test -s anons-studio/dist/auth.bundle.js
          test -s anons-studio/dist/index.html
          grep -q 'id="poster"' anons-studio/index.html
          grep -q 'id="export"' anons-studio/index.html
          grep -q 'toBlob' anons-studio/app.js
          grep -q 'localStorage' anons-studio/app.js
      - name: Test payment and export authorization boundaries
        run: node --test anons-studio/security.test.mjs anons-studio/sandbox-webhook.test.mjs anons-studio/billing-ux.test.mjs anons-studio/graphic-elements.test.mjs anons-studio/scene-layout.test.mjs
      - name: Verify live Supabase payment and premium authorization gates
        run: node --test anons-studio/live-release-gate.test.mjs
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Test actual editor, responsive layout and PNG export
        run: node anons-studio/smoke.mjs
      - name: Test two isolated simulated devices and cross-device edit conflicts
        run: node anons-studio/multi-device.mjs
      - name: Install isolated visual PNG renderer for CI only
        run: |
          mkdir -p anons-studio/.visual-ci
          echo '{"private":true,"type":"module"}' > anons-studio/.visual-ci/package.json
          npm install --prefix anons-studio/.visual-ci --no-save --no-package-lock --ignore-scripts @vercel/og@0.8.6
      - name: Compare actual PNGs from Canvas and premium server renderer
        run: node anons-studio/visual-parity.mjs
      - name: Save visual QA PNG pairs and difference maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anons-visual-parity
          path: anons-studio/visual-qa-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish standalone preview (never existing production)
        if: github.ref == 'refs/heads/feat/anons-studio-png-parity-20261103'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy anons-studio/dist --project-name=anons-studio-preview --branch=preview
