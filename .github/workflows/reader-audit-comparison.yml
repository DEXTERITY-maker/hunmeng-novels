name: Reader audit — real before/after browser captures
on:
  push:
    branches:
      - fix/reader-audit-auth-navigation-xp-ui-20261028
    paths:
      - .github/workflows/reader-audit-comparison.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build exact existing main version as the baseline
        run: |
          git worktree add --detach /tmp/hunmeng-audit-before origin/main
          cd /tmp/hunmeng-audit-before
          npm ci
          npm run build:demo
          cp -a dist "${GITHUB_WORKSPACE}/dist"
      - name: Capture BEFORE screenshots from existing main HTML/CSS/JS
        env:
          STATIC_TEST: '1'
        run: npx playwright test tests/reader-audit-visual.spec.ts --project=desktop --output=reader-audit-artifacts/before
      - name: Build the proposed FIX from this branch
        run: npm run build:demo
      - name: Capture AFTER screenshots from the same browser scenarios
        env:
          STATIC_TEST: '1'
        run: npx playwright test tests/reader-audit-visual.spec.ts --project=desktop --output=reader-audit-artifacts/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunmeng-reader-audit-before-after-${{ github.run_id }}
          path: reader-audit-artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 21
