name: Hunmeng — состояние Timeweb

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only status and public pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect selected Timeweb app and public site (no writes)
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/timeweb-status.mjs
