name: Seed committed social PNG assets once
on:
  push:
    branches:
      - feature/prelaunch-seo-og-glossary-v021
    paths:
      - .github/workflows/seed-social-assets-once.yml
      - scripts/seed-social-assets-once.py
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prelaunch-seo-og-glossary-v021
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts and local-only rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install pillow cairosvg fonttools
      - name: Produce PNG files with verified Cyrillic glyphs
        run: python scripts/seed-social-assets-once.py
      - name: Commit finished images (not generators) to feature branch
        run: |
          git config user.name "Hunmeng Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/og-default.png public/images/khranitel-mayaka-og.png public/images/sad-zimy-og.png
          git commit -m "0.2.1: добавить готовые PNG для Telegram и ВК"
          git push origin HEAD:feature/prelaunch-seo-og-glossary-v021
      - name: Delete unused empty branch only if it still matches old main
        run: |
          old="$(git ls-remote --heads origin refs/heads/feature/launch-seo-021 | cut -f1)"
          if [ -z "$old" ]; then
            echo "Old empty branch is already gone."
          elif [ "$old" = "9c7056f2e436b1c75e959ebb3b1a9d78e8057e99" ]; then
            git push origin --delete feature/launch-seo-021
          else
            echo "Refusing to delete non-empty or changed branch: $old"
            exit 1
          fi
