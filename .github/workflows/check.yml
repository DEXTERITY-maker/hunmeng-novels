name: Проверка статической сборки
on: [push, pull_request, workflow_dispatch]
# Cancel obsolete test runs for this branch or pull request; keep push and PR
# checks independent. Only final-commit results are eligible for release.
concurrency:
  group: hunmeng-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check scripts/publish-approved.mjs
      - run: node --check scripts/publication-news.mjs
      - run: node --check scripts/deploy-timeweb.mjs
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.serial.config.ts
      # Browser tests run against a separate build with the demo stories from tests/demo.
      - run: npm run build:demo
      - run: npm test
      - name: Upload actual responsive UI screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hunmeng-design-preview-${{ github.run_id }}
          path: |
            test-results/**/hunmeng-*.png
            test-results-production/**/hunmeng-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload library and profile previews
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hunmeng-library-profile-preview-${{ github.run_id }}
          path: |
            test-results-production/**/hunmeng-library-*.png
            test-results/**/hunmeng-profile-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload only chapter reader screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hunmeng-reader-chapters-${{ github.run_id }}
          path: test-results-production/**/hunmeng-chapter-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload only homepage screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hunmeng-homepage-preview-${{ github.run_id }}
          path: test-results-production/**/hunmeng-home-*.png
          if-no-files-found: error
          retention-days: 14

  deploy-timeweb:
    # Archived deployment path: Cloudflare Pages is the selected production host.
    # Remain disabled even on a push to main or a manual workflow dispatch.
    # Re-enabling requires a separate owner-approved rollback plan.
    name: Timeweb (legacy deployment disabled)
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: hunmeng-timeweb-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy the checked commit and verify public pages
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/deploy-timeweb.mjs

  v2-public-readiness:
    name: Hunmeng 2.0 canonical-route release checks
    # Keep the existing V1 test job and add a real release-flag build and
    # browser test on candidate branches, not a bypass of the default suite.
    if: >-
      startsWith(github.head_ref, 'release/hunmeng-2-') ||
      startsWith(github.ref, 'refs/heads/release/hunmeng-2-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and test public V2 routes with synthetic content
        env:
          HUNMENG_V2_PUBLIC: '1'
        run: |
          npm run build:demo
          npx playwright test --config playwright.v2-release.config.ts
      - name: Verify production build never ships demonstration books
        env:
          HUNMENG_V2_PUBLIC: '1'
          SITE_URL: https://hunmeng-novel.ru
        run: |
          rm -rf .astro dist node_modules/.astro
          npm run build
          test ! -e dist/novel/khranitel-mayaka
          test ! -e dist/novel/sad-zimy
          grep -q 'class="v2-home"' dist/index.html
          grep -q 'v2-catalog-page' dist/catalog/index.html
          test -e dist/v2/index.html
          ! grep -q '/v2/' dist/sitemap-0.xml
