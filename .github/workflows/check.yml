name: Проверка статической сборки
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check scripts/publish-approved.mjs
      - run: node --check scripts/publication-news.mjs
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.serial.config.ts
      # Browser tests run against a separate build with the demo stories from tests/demo.
      - run: npm run build:demo
      - run: npm test
