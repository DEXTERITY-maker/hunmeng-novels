name: Проверка статической сборки
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check scripts/publish-approved.mjs
      - run: node --check scripts/publication-news.mjs
      - run: node --check scripts/deploy-timeweb.mjs
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.serial.config.ts
      # Browser tests run against a separate build with the demo stories from tests/demo.
      - run: npm run build:demo
      - run: npm test
      - name: Upload actual responsive UI screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hunmeng-design-preview-${{ github.run_id }}
          path: test-results/**/hunmeng-*.png
          if-no-files-found: warn
          retention-days: 14

  deploy-timeweb:
    # Archived deployment path: Cloudflare Pages is the selected production host.
    # Remain disabled even on a push to main or a manual workflow dispatch.
    # Re-enabling requires a separate owner-approved rollback plan.
    name: Timeweb (legacy deployment disabled)
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: hunmeng-timeweb-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy the checked commit and verify public pages
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/deploy-timeweb.mjs
