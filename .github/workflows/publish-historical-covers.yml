name: Publish nine historical book covers
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: hunmeng-historical-cover-release-20261101
  cancel-in-progress: false
jobs:
  covers:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message,
        'feat(covers): publish nine historical editions 2026-11-01 [deploy cloudflare]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: pages-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check source manifest
        run: node --test tests/historical-covers.test.mjs
      - name: Retrieve and verify nine historic images
        run: node scripts/sync-historical-covers.mjs
      - name: Validate full production build
        run: npm run build
      - name: Check catalog images and dedicated news
        run: |
          test "$(find dist/images/covers -name '*-historical.webp' | wc -l)" -eq 9
          test -s dist/news/historical-covers-first-classics-2026-11-01/index.html
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('src/data/historical-covers-provenance.json'));if(x.covers.length!==9)process.exit(1);for(const a of x.covers){if(!fs.readFileSync('dist/novel/'+a.slug+'/index.html','utf8').includes(a.image))process.exit(1)}"
      - name: Commit only historical artwork, book cover pointers and release notes
        run: |
          git config user.name 'Hunmeng Editorial Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add public/images/covers/*-historical.webp src/data/historical-covers-provenance.json src/content/news/historical-covers-first-classics-2026-11-01.md
          for slug in frankenstein dracula the-time-machine the-war-of-the-worlds the-wonderful-wizard-of-oz treasure-island the-strange-case-of-dr-jekyll-and-mr-hyde the-picture-of-dorian-gray the-island-of-doctor-moreau; do
            git add "src/content/novels/$slug.json"
          done
          git diff --cached --quiet && exit 1
          git commit -m 'content(covers): historical public-domain bindings for nine classics'
          git push origin HEAD:main
      - name: Publish verified release to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hunmeng-novels --branch=main
