name: Cloudflare Pages deployment (approved revision only)
on:
  # One-time explicitly tagged release. Ordinary pushes and PRs never publish.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact approved commit to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hunmeng-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production is only a user-approved dispatch OR this single exact release title.
    # Do not deploy on arbitrary pushes, pull requests, or future release names.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.head_commit.message == 'fix(ui): publish mobile polish 2026-10-29 [deploy cloudflare]'))
    runs-on: ubuntu-latest
    environment: pages-production
    timeout-minutes: 30
    steps:
      - name: Validate approved revision
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit_sha }}
        run: |
          if [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo 'The approved commit must match the main revision that started this run.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
      - run: npm test
      - name: Build production assets
        env:
          SITE_URL: https://hunmeng-novel.ru
        run: npm run build
      - name: Publish to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hunmeng-novels --branch=main
