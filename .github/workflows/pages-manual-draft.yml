name: Manual Cloudflare Pages deployment (review required)
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact approved commit to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hunmeng-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow file must exist on the default branch to be dispatched.
    # Never publish automatically on push or pull request.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pages-production
    timeout-minutes: 30
    steps:
      - name: Validate approved revision
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo 'The approved commit must match the main revision that started this run.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
      - run: npm test
      - name: Build production assets
        env:
          SITE_URL: https://hunmeng-novel.ru
        run: npm run build
      - name: Publish to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hunmeng-novels --branch=main
