name: Verify historical Alice cover without publishing
on:
  pull_request:
    paths:
      - 'scripts/sync-alice-historical-cover.mjs'
      - 'scripts/verify-alice-cover-preview.mjs'
      - 'public/images/covers/alices-adventures-in-wonderland-1865.jpg'
      - 'src/content/novels/alices-adventures-in-wonderland.json'
      - 'src/content/news/alice-historical-cover-2026-11-01.md'
      - '.github/workflows/publish-alice-historical-cover.yml'
      - '.github/workflows/verify-alice-cover.yml'
      - 'tests/alice-original-cover.test.mjs'
      - 'tests/alice-cover-preview.test.mjs'

permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/alice-original-cover.test.mjs tests/alice-cover-preview.test.mjs
      - name: Verify committed historical cover and provenance
        run: node scripts/verify-alice-cover-preview.mjs
      - name: Validate the production build and cover page
        run: |
          npm run build
          test -s dist/images/covers/alices-adventures-in-wonderland-1865.jpg
          grep -q 'alices-adventures-in-wonderland-1865.jpg' dist/novel/alices-adventures-in-wonderland/index.html
          test -s dist/news/alice-historical-cover-2026-11-01/index.html
