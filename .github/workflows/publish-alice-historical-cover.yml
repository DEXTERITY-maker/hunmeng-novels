name: Publish verified historical Alice book cover
on:
  push:
    branches: [main]

permissions:
  contents: write
concurrency:
  group: hunmeng-pages-production
  cancel-in-progress: false

jobs:
  publish-cover:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message,
        'feat(cover): publish original Alice 1865 cover 2026-11-01 [deploy cloudflare]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: pages-production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate rights provenance and source checksums
        run: node --test tests/alice-original-cover.test.mjs
      - name: Synchronize historical image and metadata
        run: node scripts/sync-alice-historical-cover.mjs
      - name: Check downloaded historical cover and completed metadata
        run: |
          test -s public/images/covers/alices-adventures-in-wonderland-1865.jpg
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('src/content/novels/alices-adventures-in-wonderland.json')); if(d.cover!=='/images/covers/alices-adventures-in-wonderland-1865.jpg')process.exit(1)"
      - name: Build production site with updated cover
        run: npm run build
      - name: Verify catalog, detail and news have the new cover
        run: |
          test -s dist/images/covers/alices-adventures-in-wonderland-1865.jpg
          grep -q 'alices-adventures-in-wonderland-1865.jpg' dist/novel/alices-adventures-in-wonderland/index.html
          grep -q 'alices-adventures-in-wonderland-1865.jpg' dist/catalog/index.html
          test -s dist/news/alice-historical-cover-2026-11-01/index.html
      - name: Commit only the historical cover, novel metadata and news
        id: commit
        run: |
          git config user.name "Hunmeng Editorial Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/covers/alices-adventures-in-wonderland-1865.jpg src/content/novels/alices-adventures-in-wonderland.json src/content/news/alice-historical-cover-2026-11-01.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "content(cover): historic 1865 Alice first-edition cover"
          git push origin HEAD:main
      - name: Deploy approved cover and reading catalog to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hunmeng-novels --branch=main
