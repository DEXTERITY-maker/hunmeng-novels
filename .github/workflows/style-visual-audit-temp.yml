name: Style consolidation visual comparison
on:
  push:
    branches: ['refactor/css-consolidation-20261030']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build exact main baseline with demo content
        run: |
          git worktree add --detach "$RUNNER_TEMP/hunmeng-before" e5925e236cdabc25e8ed37c002116c112ae7bd34
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/hunmeng-before/node_modules"
          cd "$RUNNER_TEMP/hunmeng-before"
          npm run build:demo
      - name: Capture baseline
        run: node scripts/style-visual-capture-temp.mjs "$RUNNER_TEMP/hunmeng-before/dist" visual-before
      - name: Build candidate with demo content
        run: npm run build:demo
      - name: Capture candidate
        run: node scripts/style-visual-capture-temp.mjs dist visual-after
      - name: Compare all screenshots
        id: compare
        run: node scripts/style-visual-diff-temp.mjs visual-before visual-after visual-report
      - name: Collect mobile proof
        if: always()
        run: |
          mkdir -p visual-previews
          cp visual-before/mobile-light-home.png visual-previews/home-before.png
          cp visual-after/mobile-light-home.png visual-previews/home-after.png
          cp visual-before/mobile-light-reader.png visual-previews/reader-before.png
          cp visual-after/mobile-light-reader.png visual-previews/reader-after.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-visual-comparison-${{ github.run_id }}
          path: |
            visual-before/*.png
            visual-after/*.png
            visual-report/*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-mobile-previews-${{ github.run_id }}
          path: visual-previews/*.png
          if-no-files-found: error
          retention-days: 30
