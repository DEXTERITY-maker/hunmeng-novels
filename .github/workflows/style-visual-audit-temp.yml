name: Style consolidation visual baseline
on:
  push:
    branches: ['refactor/css-consolidation-20261030']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
      - run: node scripts/style-visual-capture-temp.mjs dist visual-before
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-visual-baseline-${{ github.run_id }}
          path: visual-before/*.png
          if-no-files-found: error
          retention-days: 30
