name: Automatic update news
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunmeng-news-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate verified changelog entry
        run: node scripts/generate-update-news.mjs
      - name: Validate release note and static build
        run: |
          npm ci
          npm run build
      - name: Commit update note to main
        run: |
          if [ -z "$(git status --porcelain -- src/content/news)" ]; then
            echo "No reader-visible update note to publish."
            exit 0
          fi
          git config user.name "Hunmeng News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/news
          git commit -m "Добавить новость о выпущенных изменениях"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
